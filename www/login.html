<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Big Man Computer</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/"><span class="nav-title">BMC</span></a>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/editor" class="nav-link">Editor</a>
            <a href="/examples" class="nav-link">Examples</a>
            <a href="/help" class="nav-link">Help</a>
            <a href="/credits" class="nav-link">Credits</a>
            <div class="nav-auth" id="nav-auth">
                <a href="/login" class="btn btn-outline btn-sm">Log In</a>
                <a href="/signup" class="btn btn-primary btn-sm">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="form-page">
        <div class="form-card">
            <h2>Welcome Back</h2>
            <p class="form-subtitle">Log in to access your saved programs</p>

            <div class="alert alert-error" id="login-error"></div>

            <form id="login-form" onsubmit="return false;">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <div id="captcha"></div>
                    <div class="form-error" id="captcha-error">Please complete the verification</div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="login-btn">Log In</button>
                </div>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="/signup">Sign up</a>
            </div>
        </div>
    </div>

    <script src="https://autogate.mjdawson.net/lib/autogate.js" onerror="window._agFailed=true"></script>
    <script src="/js/app.js"></script>
    <script>
        let captchaToken = '';
        let captchaReady = false;

        try {
            if (typeof AutoGate !== 'undefined') {
                const gate = new AutoGate('#captcha', 'd38ef9571362f1864b080ccfc7c9c966', {
                    theme: 'dark'
                });
                gate.onSuccess = (token) => {
                    captchaToken = token;
                    captchaReady = true;
                };
            } else {
                captchaReady = true;
                document.getElementById('captcha').style.display = 'none';
            }
        } catch(err) {
            captchaReady = true;
            document.getElementById('captcha').style.display = 'none';
        }

        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-btn');
            errorEl.style.display = 'none';
            document.getElementById('captcha-error').style.display = 'none';

            if (typeof AutoGate !== 'undefined' && !captchaToken) {
                document.getElementById('captcha-error').style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                        captcha: captchaToken
                    })
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.style.display = 'block';
                }
            } catch(err) {
                errorEl.textContent = 'Connection error. Please try again.';
                errorEl.style.display = 'block';
            }

            btn.disabled = false;
            btn.textContent = 'Log In';
        });
    </script>
</body>
</html>
