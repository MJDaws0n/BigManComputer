services:
  bmc:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "${BMC_PORT:-8080}:8080"
    volumes:
      # Persist user data across container restarts
      - bmc-data:/app/data
    restart: unless-stopped
    environment:
      - BMC_PORT=8080

volumes:
  bmc-data:
